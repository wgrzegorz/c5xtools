<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a8a8a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ff5555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="320" rx="10" fill="#0d0d0d" stroke="#262626"/>

  <!-- row labels -->
  <text x="40" y="34" fill="#ff5555" font-size="13" font-weight="700">c5xtools</text>
  <text x="40" y="300" fill="#c9962f" font-size="13" font-weight="700">TI reference tools</text>
  <text x="142" y="300" fill="#7a7a7a" font-size="11">(captured once)</text>

  <!-- shared source -->
  <rect x="24" y="128" width="118" height="56" rx="7" fill="#161616" stroke="#e8e8e8"/>
  <text x="83" y="151" fill="#e8e8e8" font-size="13" text-anchor="middle">corpus.asm</text>
  <text x="83" y="169" fill="#8a8a8a" font-size="10.5" text-anchor="middle">(committed)</text>

  <!-- top pipeline (c5xtools) -->
  <g fill="#1a1414" stroke="#ff5555">
    <rect x="212" y="58" width="92" height="44" rx="7"/>
    <rect x="344" y="58" width="92" height="44" rx="7"/>
    <rect x="476" y="58" width="112" height="44" rx="7"/>
  </g>
  <g fill="#f2f2f2" font-size="13" text-anchor="middle">
    <text x="258" y="85">c5xasm</text>
    <text x="390" y="85">c5xlnk</text>
    <text x="532" y="85">out2img.sh</text>
  </g>
  <!-- top output chip -->
  <rect x="628" y="58" width="92" height="44" rx="7" fill="#2a1414" stroke="#ff8a8a"/>
  <text x="674" y="85" fill="#ffd0d0" font-size="13" text-anchor="middle">image</text>

  <!-- bottom pipeline (TI reference) -->
  <g fill="#15130e" stroke="#9c7d30">
    <rect x="212" y="214" width="112" height="44" rx="7"/>
    <rect x="356" y="214" width="92" height="44" rx="7"/>
    <rect x="480" y="214" width="92" height="44" rx="7"/>
  </g>
  <g fill="#e6e0cf" font-size="12.5" text-anchor="middle">
    <text x="268" y="241">assembler</text>
    <text x="402" y="241">linker</text>
    <text x="526" y="241">out2img</text>
  </g>
  <!-- bottom golden chip -->
  <rect x="612" y="214" width="108" height="44" rx="7" fill="#1d1a10" stroke="#d9b24a"/>
  <text x="666" y="236" fill="#f0e3bf" font-size="12.5" text-anchor="middle">corpus.img</text>
  <text x="666" y="251" fill="#b79a52" font-size="10" text-anchor="middle">(golden)</text>

  <!-- compare node -->
  <rect x="770" y="108" width="140" height="104" rx="9" fill="#0f1a0f" stroke="#49b06a"/>
  <text x="840" y="146" fill="#bdf0cb" font-size="13" text-anchor="middle" font-weight="700">compare</text>
  <text x="840" y="166" fill="#8fce9f" font-size="10.5" text-anchor="middle">SHA-256,</text>
  <text x="840" y="180" fill="#8fce9f" font-size="10.5" text-anchor="middle">byte-for-byte</text>
  <text x="840" y="200" fill="#e8e8e8" font-size="11.5" text-anchor="middle">match = pass</text>

  <!-- arrows: source forks -->
  <path d="M142 148 C 176 128, 182 92, 210 82" fill="none" stroke="#ff5555" stroke-width="1.6" marker-end="url(#arR)"/>
  <path d="M142 164 C 176 190, 182 226, 210 236" fill="none" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- arrows: top row -->
  <g stroke="#ff5555" stroke-width="1.6" fill="none" marker-end="url(#arR)">
    <path d="M304 80 L342 80"/>
    <path d="M436 80 L474 80"/>
    <path d="M588 80 L626 80"/>
  </g>
  <!-- arrows: bottom row -->
  <g stroke="#8a8a8a" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M324 236 L354 236"/>
    <path d="M448 236 L478 236"/>
    <path d="M572 236 L610 236"/>
  </g>
  <!-- arrows into compare -->
  <path d="M720 80 C 752 80, 756 128, 770 140" fill="none" stroke="#ff5555" stroke-width="1.6" marker-end="url(#arR)"/>
  <path d="M720 236 C 752 236, 756 192, 770 180" fill="none" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#ar)"/>
</svg>
